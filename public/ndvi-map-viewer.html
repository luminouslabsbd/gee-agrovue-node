<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NDVI Time Series Map Viewer</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .content {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 20px;
        }
        
        #map {
            height: 600px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            background: #e0e0e0;
        }
        
        .sidebar {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow-y: auto;
            max-height: 600px;
        }
        
        .sidebar h3 {
            margin-bottom: 15px;
            color: #333;
            font-size: 16px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-size: 12px;
            font-weight: 600;
        }
        
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 12px;
        }
        
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        button {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #667eea;
        }
        
        .loading.show {
            display: block;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            background: #fee;
            color: #c33;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 12px;
            display: none;
        }
        
        .error.show {
            display: block;
        }
        
        .success {
            background: #efe;
            color: #3c3;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 12px;
            display: none;
        }
        
        .success.show {
            display: block;
        }
        
        .map-list {
            margin-top: 20px;
        }
        
        .map-item {
            background: #f9f9f9;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
            cursor: pointer;
            border-left: 3px solid #667eea;
            transition: background 0.2s;
        }
        
        .map-item:hover {
            background: #f0f0f0;
        }
        
        .map-item.active {
            background: #e8e8ff;
            border-left-color: #764ba2;
        }
        
        .map-date {
            font-weight: 600;
            color: #333;
            font-size: 12px;
        }
        
        .map-ndvi {
            font-size: 11px;
            color: #666;
            margin-top: 3px;
        }
        
        .legend {
            background: white;
            padding: 15px;
            border-radius: 4px;
            margin-top: 20px;
            font-size: 11px;
        }
        
        .legend-title {
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }
        
        .legend-color {
            width: 20px;
            height: 15px;
            margin-right: 8px;
            border-radius: 2px;
        }
        
        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }
            
            #map {
                height: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🗺️ NDVI Time Series Map Viewer</h1>
            <p>View NDVI maps and vegetation trends for your field</p>
        </div>
        
        <div class="content">
            <div id="map"></div>
            
            <div class="sidebar">
                <h3>Generate Maps</h3>
                
                <div class="error" id="error"></div>
                <div class="success" id="success"></div>
                
                <div class="form-group">
                    <label>Start Date</label>
                    <input type="date" id="startDate" value="2025-01-01">
                </div>
                
                <div class="form-group">
                    <label>End Date</label>
                    <input type="date" id="endDate" value="2025-12-31">
                </div>
                
                <div class="form-group">
                    <label>Interval (days)</label>
                    <select id="interval">
                        <option value="5">5 days (High resolution)</option>
                        <option value="10" selected>10 days (Standard)</option>
                        <option value="15">15 days (Bi-weekly)</option>
                        <option value="30">30 days (Monthly)</option>
                    </select>
                </div>
                
                <button onclick="generateMaps()">Generate Maps</button>
                
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>Generating maps...</p>
                </div>
                
                <div class="map-list" id="mapList"></div>
                
                <div class="legend">
                    <div class="legend-title">NDVI Scale</div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #d73027;"></div>
                        <span>Poor (-1 to 0)</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #fc8d59;"></div>
                        <span>Sparse (0 to 0.2)</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #fee090;"></div>
                        <span>Bare (0.2 to 0.4)</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #e0f3f8;"></div>
                        <span>Moderate (0.4 to 0.6)</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #91bfdb;"></div>
                        <span>Good (0.6 to 0.8)</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #4575b4;"></div>
                        <span>Excellent (0.8 to 1)</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Leaflet JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    
    <script>
        let map;
        let currentLayers = [];
        let allMaps = [];
        
        // Initialize map
        function initMap() {
            map = L.map('map').setView([23.84, 90.37], 15);
            
            // Add base layer
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors',
                maxZoom: 19
            }).addTo(map);
        }
        
        // Generate maps
        async function generateMaps() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const interval = document.getElementById('interval').value;
            
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const success = document.getElementById('success');
            
            loading.classList.add('show');
            error.classList.remove('show');
            success.classList.remove('show');
            
            try {
                const response = await fetch('/api/field-analysis/time-series-map', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        fieldBoundary: {
                            type: 'Polygon',
                            coordinates: [[[90.37110641598703, 23.841231509287553],
                                          [90.37093743681908, 23.84014467798467],
                                          [90.37123516201974, 23.84014713133873],
                                          [90.3713531792164, 23.840186384997345],
                                          [90.37110641598703, 23.841231509287553]]]
                        },
                        fieldId: 'NGR-KD-12345',
                        startDate,
                        endDate,
                        intervalDays: parseInt(interval)
                    })
                });
                
                if (!response.ok) throw new Error('API request failed');
                
                const data = await response.json();
                allMaps = data.data.maps;
                
                displayMaps();
                success.textContent = `✅ Generated ${allMaps.length} maps successfully!`;
                success.classList.add('show');
                
            } catch (err) {
                error.textContent = `❌ Error: ${err.message}`;
                error.classList.add('show');
            } finally {
                loading.classList.remove('show');
            }
        }
        
        // Display maps
        function displayMaps() {
            const mapList = document.getElementById('mapList');
            mapList.innerHTML = '<h3 style="margin-bottom: 10px;">Available Maps</h3>';
            
            allMaps.forEach((mapData, index) => {
                const item = document.createElement('div');
                item.className = 'map-item' + (index === 0 ? ' active' : '');
                item.innerHTML = `
                    <div class="map-date">${mapData.date}</div>
                    <div class="map-ndvi">NDVI: ${mapData.statistics.mean_ndvi.toFixed(2)}</div>
                `;
                item.onclick = () => selectMap(index);
                mapList.appendChild(item);
            });
            
            // Display first map
            if (allMaps.length > 0) {
                selectMap(0);
            }
        }
        
        // Select and display map
        function selectMap(index) {
            const mapData = allMaps[index];
            
            // Remove old layers
            currentLayers.forEach(layer => map.removeLayer(layer));
            currentLayers = [];
            
            // Add new layer
            const layer = L.tileLayer(
                `https://earthengine.googleapis.com/map/${mapData.map_id}/{z}/{x}/{y}?token=${mapData.map_token}`,
                {
                    attribution: `NDVI - ${mapData.date}`,
                    opacity: 0.7,
                    maxZoom: 20
                }
            ).addTo(map);
            
            currentLayers.push(layer);
            
            // Update active item
            document.querySelectorAll('.map-item').forEach((item, i) => {
                item.classList.toggle('active', i === index);
            });
        }
        
        // Initialize on load
        window.addEventListener('load', initMap);
    </script>
</body>
</html>
