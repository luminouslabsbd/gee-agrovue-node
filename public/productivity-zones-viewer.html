<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌾 Productivity Zones Viewer - Agrovue</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .field-selector {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .field-selector label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }

        .field-selector input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .field-selector input:focus {
            outline: none;
            border-color: #2ecc71;
        }

        .field-selector button {
            margin-top: 15px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .field-selector button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.3);
        }

        .images-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 30px;
            margin-bottom: 30px;
        }

        .image-card {
            background: #f8f9fa;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }

        .image-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .image-card-header {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
            padding: 15px 20px;
            font-weight: bold;
            font-size: 1.2em;
        }

        .image-card-body {
            padding: 20px;
        }

        .image-card img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .image-card p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .image-card a {
            display: inline-block;
            padding: 10px 20px;
            background: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            transition: background 0.3s;
        }

        .image-card a:hover {
            background: #2980b9;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .stat-card.green {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
        }

        .stat-card.blue {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
        }

        .stat-card.orange {
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
        }

        .stat-card.purple {
            background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%);
        }

        .stat-card h3 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .stat-card p {
            font-size: 1em;
            opacity: 0.9;
        }

        .legend {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        .legend h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .legend-items {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .legend-color {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            margin-right: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .legend-text {
            flex: 1;
        }

        .legend-text strong {
            display: block;
            color: #333;
            margin-bottom: 3px;
        }

        .legend-text span {
            color: #666;
            font-size: 0.9em;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #666;
            font-size: 1.2em;
        }

        .error {
            background: #e74c3c;
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
        }

        .success {
            background: #2ecc71;
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
        }

        @media (max-width: 768px) {
            .images-grid {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 1.8em;
            }
            
            .stat-card h3 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌾 Productivity Zones Viewer</h1>
            <p>Analyze field productivity with NDVI zones and crop yield predictions</p>
        </div>

        <div class="content">
            <div class="field-selector">
                <label for="fieldId">🌍 Enter Field ID:</label>
                <input type="text" id="fieldId" placeholder="e.g., FIELD-20251030-79C392" value="FIELD-20251030-79C392">
                <button onclick="loadZoneData()">📊 Load Zone Analysis</button>
            </div>

            <div id="results"></div>
        </div>
    </div>

    <script>
        async function loadZoneData() {
            const fieldId = document.getElementById('fieldId').value.trim();
            const resultsDiv = document.getElementById('results');

            if (!fieldId) {
                resultsDiv.innerHTML = '<div class="error">❌ Please enter a Field ID</div>';
                return;
            }

            resultsDiv.innerHTML = '<div class="loading">⏳ Loading zone analysis data...</div>';

            try {
                // Load metadata
                const response = await fetch(`/zone-images/${fieldId}/metadata.json`);
                
                if (!response.ok) {
                    throw new Error('Zone data not found for this field');
                }

                const data = await response.json();
                displayZoneData(data, fieldId);
            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
            }
        }

        function displayZoneData(data, fieldId) {
            const resultsDiv = document.getElementById('results');
            
            const html = `
                <div class="success">✅ Zone analysis loaded successfully!</div>

                <div class="stats-grid">
                    <div class="stat-card green">
                        <h3>${data.ndvi_statistics.mean.toFixed(3)}</h3>
                        <p>📊 Mean NDVI</p>
                    </div>
                    <div class="stat-card blue">
                        <h3>${data.zone_analysis.summary.total_zones}</h3>
                        <p>🗺️ Total Zones</p>
                    </div>
                    <div class="stat-card orange">
                        <h3>${data.zone_analysis.summary.total_area_hectares.toFixed(2)} ha</h3>
                        <p>📏 Total Area</p>
                    </div>
                    <div class="stat-card purple">
                        <h3>${data.yield_predictions.field_summary.total_estimated_yield_tons.toFixed(2)} t</h3>
                        <p>🌾 Estimated Yield</p>
                    </div>
                </div>

                <div class="images-grid">
                    <div class="image-card">
                        <div class="image-card-header">🗺️ NDVI Map</div>
                        <div class="image-card-body">
                            <img src="/zone-images/${fieldId}/ndvi_map.png" alt="NDVI Map">
                            <p>Color-coded vegetation health visualization showing NDVI values across the field.</p>
                            <a href="/zone-images/${fieldId}/ndvi_map.png" target="_blank">🔍 View Full Size</a>
                        </div>
                    </div>

                    <div class="image-card">
                        <div class="image-card-header">🎨 Productivity Zones</div>
                        <div class="image-card-body">
                            <img src="/zone-images/${fieldId}/zone_map.png" alt="Zone Map">
                            <p>Field divided into productivity zones based on NDVI classification.</p>
                            <a href="/zone-images/${fieldId}/zone_map.png" target="_blank">🔍 View Full Size</a>
                        </div>
                    </div>
                </div>

                <div class="legend">
                    <h2>🎨 Zone Classification Legend</h2>
                    <div class="legend-items">
                        <div class="legend-item">
                            <div class="legend-color" style="background: #006400;"></div>
                            <div class="legend-text">
                                <strong>Excellent</strong>
                                <span>NDVI ≥ 0.7</span>
                            </div>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color" style="background: #32CD32;"></div>
                            <div class="legend-text">
                                <strong>Good</strong>
                                <span>NDVI 0.5 - 0.7</span>
                            </div>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color" style="background: #FFD700;"></div>
                            <div class="legend-text">
                                <strong>Moderate</strong>
                                <span>NDVI 0.3 - 0.5</span>
                            </div>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color" style="background: #FF8C00;"></div>
                            <div class="legend-text">
                                <strong>Poor</strong>
                                <span>NDVI 0.1 - 0.3</span>
                            </div>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color" style="background: #DC143C;"></div>
                            <div class="legend-text">
                                <strong>Very Poor</strong>
                                <span>NDVI < 0.1</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            resultsDiv.innerHTML = html;
        }

        // Auto-load on page load
        window.addEventListener('load', () => {
            loadZoneData();
        });
    </script>
</body>
</html>
